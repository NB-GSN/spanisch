<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misión Madrid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bree+Serif&display=swap" rel="stylesheet">
<style>
:root{
  /* Welt: Madrider Azulejo-Straßenschilder. Kobalt auf Fliesenweiß, Ocker als einziger warmer Akzent. */
  /* Layout: eine schmale Spalte wie ein Fahrtenbuch; jede Station ist ein Straßenschild. */
  --paper:#ECE8DC;
  --tile:#FCFBF7;
  --cobalt:#1F3C88;
  --cobalt-2:#2E57B8;
  --cobalt-soft:#DCE3F4;
  --ochre:#E2A033;
  --ochre-soft:#F7E6C2;
  --ink:#1B2233;
  --muted:#586178;
  --ok:#22804F;
  --ok-soft:#DCF0E3;
  --bad:#B8382C;
  --bad-soft:#F7DFDA;
  --display:"Bree Serif", Rockwell, Georgia, serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background-color:var(--paper);
  background-image:
    radial-gradient(circle at 50% 50%, transparent 0 29%, rgba(31,60,136,.075) 30% 32%, transparent 33%),
    conic-gradient(from 45deg at 50% 50%, rgba(31,60,136,.045) 0 25%, transparent 0 50%, rgba(31,60,136,.045) 0 75%, transparent 0);
  background-size:64px 64px;
  color:var(--ink);
  font-family:var(--body);
  font-size:18px;
  line-height:1.5;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;color:var(--cobalt);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}

/* HUD */
#hud{position:sticky;top:0;z-index:20;background:var(--cobalt);color:var(--tile);display:none}
#hud.on{display:block}
.hud-in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;gap:12px;align-items:center}
.hud-me{display:flex;gap:8px;align-items:center;min-width:0;flex:1}
.hud-me .av{font-size:26px;line-height:1}
.hud-me b{font-family:var(--display);font-weight:400;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-stat{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;font-size:16px}
.hud-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:10px;min-height:44px;min-width:44px;padding:0 12px;color:var(--tile);font-weight:700}
.hud-btn:hover{background:rgba(255,255,255,.22)}

main{max-width:760px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:18px}

/* Plaque = Azulejo-Straßenschild */
.plaque{
  background:var(--tile);
  border:3px solid var(--cobalt);
  border-radius:6px;
  box-shadow:inset 0 0 0 5px var(--tile), inset 0 0 0 7px var(--cobalt-2), 0 3px 0 rgba(31,60,136,.25);
  padding:22px 22px;
  position:relative;
}
.plaque::before,.plaque::after{
  content:"";position:absolute;width:12px;height:12px;background:var(--ochre);transform:rotate(45deg);top:-7px;
}
.plaque::before{left:-7px}
.plaque::after{right:-7px}
.card{background:var(--tile);border-radius:14px;padding:20px;box-shadow:0 1px 0 rgba(31,60,136,.15),0 8px 24px rgba(27,34,51,.07);display:flex;flex-direction:column;gap:14px}

/* Start */
.title-plaque{text-align:center;padding:30px 20px 24px}
.title-plaque .calle{font-family:var(--display);font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.title-plaque h1{font-size:clamp(42px,9vw,64px);margin:6px 0 4px}
.title-plaque .sub{font-family:var(--display);font-size:22px;color:var(--ochre);text-shadow:0 1px 0 rgba(0,0,0,.08)}
.lead{color:var(--muted);max-width:60ch}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.field small{color:var(--muted)}
input[type=text]{font:inherit;font-size:20px;padding:12px 14px;border:2px solid var(--cobalt-soft);border-radius:10px;background:#fff;color:var(--ink);width:100%}
input[type=text]:focus{border-color:var(--cobalt-2);outline:none}
.avatars{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
@media (max-width:480px){.avatars{grid-template-columns:repeat(4,1fr)}}
.avatars button{font-size:30px;aspect-ratio:1;border-radius:12px;border:2px solid var(--cobalt-soft);background:#fff}
.avatars button[aria-pressed=true]{border-color:var(--cobalt);background:var(--ochre-soft);box-shadow:0 0 0 2px var(--cobalt)}
details{border-top:1px dashed var(--cobalt-soft);padding-top:10px}
summary{cursor:pointer;font-weight:700;color:var(--cobalt);min-height:36px;display:flex;align-items:center}
.teacher ul{padding-left:20px;margin:8px 0}
.teacher li{margin:4px 0}
.err{color:var(--bad);font-weight:700}

.btn{border:none;border-radius:12px;min-height:52px;padding:10px 20px;font-weight:700;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--cobalt);color:var(--tile);box-shadow:0 3px 0 #142a63}
.btn.primary:hover{background:var(--cobalt-2)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #142a63}
.btn.warm{background:var(--ochre);color:var(--ink);box-shadow:0 3px 0 #b07619}
.btn.ghost{background:transparent;border:2px solid var(--cobalt-soft);color:var(--cobalt)}
.btn.ghost:hover{border-color:var(--cobalt)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 200px}

/* Story */
.scene-title{font-size:30px}
.story-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.de-btn{border:2px solid var(--cobalt-soft);background:var(--tile);border-radius:999px;padding:6px 14px;min-height:40px;font-weight:700;color:var(--cobalt)}
.de-btn[aria-pressed=true]{background:var(--cobalt);color:var(--tile);border-color:var(--cobalt)}
.bubbles{display:flex;flex-direction:column;gap:12px}
.bubble{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start;animation:rise .35s ease both}
.bubble:nth-child(2){animation-delay:.12s}.bubble:nth-child(3){animation-delay:.24s}.bubble:nth-child(4){animation-delay:.36s}.bubble:nth-child(5){animation-delay:.48s}.bubble:nth-child(6){animation-delay:.6s}.bubble:nth-child(7){animation-delay:.72s}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.bubble .who{width:48px;height:48px;border-radius:50%;background:var(--cobalt-soft);display:grid;place-items:center;font-size:26px}
.bubble .msg{background:var(--tile);border-radius:4px 16px 16px 16px;padding:10px 14px;box-shadow:0 1px 0 rgba(31,60,136,.15)}
.bubble .name{font-family:var(--display);color:var(--cobalt);font-size:15px}
.bubble.narr{grid-template-columns:1fr}
.bubble.narr .msg{background:transparent;box-shadow:none;border-left:4px solid var(--ochre);border-radius:0;font-style:italic;padding:4px 14px}
.bubble.rule .msg{background:var(--ochre-soft);border-radius:12px;font-style:normal;border:none}
.es-line{display:flex;gap:8px;align-items:flex-start}
.es-line .t{flex:1}
.de{display:none;color:var(--muted);font-style:italic;font-size:16px;margin-top:4px}
body.show-de .de{display:block}
.say{flex:none;border:none;background:var(--cobalt-soft);border-radius:50%;width:36px;height:36px;font-size:17px;display:grid;place-items:center}
.say:hover{background:var(--ochre-soft)}

.levels{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.levels{grid-template-columns:1fr}}
.level{background:var(--tile);border:3px solid var(--cobalt-soft);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px}
.level:hover{border-color:var(--cobalt)}
.level .ic{font-size:30px}
.level b{font-family:var(--display);font-weight:400;font-size:24px;color:var(--cobalt)}
.level span:last-child{color:var(--muted);font-size:16px}
.level.ex{border-color:var(--ochre)}

/* Karte */
.map-head{display:flex;flex-direction:column;gap:6px}
.codeslots{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.codeslots .lbl{font-weight:700;color:var(--muted);margin-right:4px}
.slot{width:46px;height:52px;border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-size:28px;background:var(--tile);border:2px dashed var(--cobalt-soft);color:var(--cobalt)}
.slot.got{border:2px solid var(--cobalt);box-shadow:inset 0 0 0 3px var(--tile),inset 0 0 0 4px var(--cobalt-2);background:var(--tile)}
.route{display:flex;flex-direction:column;gap:0;position:relative}
.stop{display:grid;grid-template-columns:52px 1fr;gap:14px;position:relative;padding-bottom:18px}
.stop::before{content:"";position:absolute;left:25px;top:52px;bottom:0;border-left:4px dotted var(--cobalt-2);opacity:.45}
.stop:last-child::before{display:none}
.stop-num{width:52px;height:52px;border-radius:50%;background:var(--cobalt);color:var(--tile);display:grid;place-items:center;font-family:var(--display);font-size:24px;z-index:1}
.stop.locked .stop-num{background:#A9B0C2}
.stop.done .stop-num{background:var(--ok)}
.stop .plaque{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.stop.locked .plaque{opacity:.6}
.stop h3{font-size:24px}
.stop .sub{color:var(--muted);font-style:italic}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.topics li{background:var(--cobalt-soft);color:var(--cobalt);border-radius:999px;padding:2px 10px;font-size:15px;font-weight:700}
.stop-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stars{font-size:24px;letter-spacing:2px;color:var(--ochre)}
.stars .off{color:#C9CDD8}

/* Aufgabe */
.task-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.task-top .where{font-family:var(--display);font-weight:400;color:var(--cobalt);font-size:19px}
.bar{height:10px;background:var(--cobalt-soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ochre);border-radius:999px;transition:width .4s}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:14px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--cobalt-soft);color:var(--cobalt)}
.chip.rev{background:var(--ochre-soft);color:#7A4E0A}
.chip.ex{background:var(--ochre);color:var(--ink)}
.q{font-weight:700;font-size:19px}
.es{font-family:var(--display);font-size:24px;color:var(--ink);line-height:1.35}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--ochre);color:transparent}
.scene{font-size:56px;line-height:1.1;background:linear-gradient(180deg,#E7F0FB,#F5F1E4);border-radius:12px;padding:14px;text-align:center;letter-spacing:6px}
.reading{background:var(--ochre-soft);border-radius:12px;padding:12px 16px;border:none}
.reading summary{color:#6B4407}
.reading p{margin-top:8px}
.reading .gloss{font-size:15px;color:var(--muted);margin-top:8px}

.choices{display:grid;gap:10px}
.choice{background:#fff;border:2px solid var(--cobalt-soft);border-radius:12px;min-height:56px;padding:10px 16px;text-align:left;font-size:20px;font-weight:700}
.choice:hover:not([disabled]){border-color:var(--cobalt)}
.choice.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.choice.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.choice[disabled]{cursor:default}
.listen-btn{align-self:flex-start}

.accents{display:flex;gap:6px;flex-wrap:wrap}
.accents button{min-width:44px;min-height:44px;border-radius:8px;border:2px solid var(--cobalt-soft);background:#fff;font-size:20px;font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mbtn{background:#fff;border:2px solid var(--cobalt-soft);border-radius:10px;min-height:52px;padding:8px 10px;font-weight:700;font-size:17px;text-align:left}
.mbtn.sel{border-color:var(--cobalt);background:var(--cobalt-soft)}
.mbtn.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.mbtn.bad{border-color:var(--bad);background:var(--bad-soft)}
.mbtn[disabled]{cursor:default}

.answer-line{min-height:62px;border:2px dashed var(--cobalt-soft);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.answer-line:empty::before{content:"Tippe die Wörter in der richtigen Reihenfolge an …";color:var(--muted);font-style:italic;padding-left:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.wtile{background:var(--tile);border:2px solid var(--cobalt);border-radius:6px;padding:8px 12px;font-family:var(--display);font-size:20px;color:var(--cobalt);min-height:46px;box-shadow:0 2px 0 var(--cobalt)}
.wtile[disabled]{cursor:default}

.fb{border-radius:12px;padding:12px 16px;line-height:1.45}
.fb.ok{background:var(--ok-soft);color:#14512F;border-left:6px solid var(--ok)}
.fb.bad{background:var(--bad-soft);color:#6D1E16;border-left:6px solid var(--bad)}
.fb.info{background:var(--cobalt-soft);color:var(--cobalt)}
.fb .rule{display:block;margin-top:6px;font-size:16px}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{background:var(--ochre-soft);border-radius:10px;padding:8px 12px;font-size:17px}
.hint b{color:#7A4E0A}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 160px}

/* Ergebnis */
.result{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.bigstars{font-size:48px;letter-spacing:6px;color:var(--ochre)}
.bigstars span{display:inline-block;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.bigstars span:nth-child(2){animation-delay:.25s}.bigstars span:nth-child(3){animation-delay:.5s}
.bigstars .off{color:#C9CDD8}
@keyframes pop{from{transform:scale(.2) rotate(-30deg);opacity:.001}to{transform:none;opacity:1}}
.letter-tile{width:96px;height:104px;display:grid;place-items:center;font-family:var(--display);font-size:64px;color:var(--cobalt);background:var(--tile);border:3px solid var(--cobalt);border-radius:6px;box-shadow:inset 0 0 0 5px var(--tile),inset 0 0 0 7px var(--cobalt-2),0 4px 0 rgba(31,60,136,.3);animation:flip .8s .6s ease both}
@keyframes flip{from{transform:perspective(400px) rotateY(90deg)}to{transform:none}}
.letter-row{display:flex;gap:16px;align-items:center}
.codebox{background:var(--cobalt);color:var(--tile);border-radius:12px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;width:100%}
.codebox .c{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:24px;letter-spacing:.08em;font-weight:700}
.codebox .lbl{font-size:14px;opacity:.85;display:block}
.codebox button{background:var(--ochre);border:none;border-radius:8px;min-height:40px;padding:0 14px;font-weight:700;color:var(--ink)}
.newtro{display:flex;flex-direction:column;gap:8px;width:100%}
.tro-line{display:flex;gap:10px;align-items:center;background:var(--ochre-soft);border-radius:10px;padding:8px 12px}
.tro-line .i{font-size:28px}

/* Trophäen */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tro{background:#fff;border:2px solid var(--cobalt-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.tro .i{font-size:34px}
.tro b{font-family:var(--display);font-weight:400;color:var(--cobalt);font-size:18px}
.tro span{font-size:14px;color:var(--muted)}
.tro.lock{background:#F2F1EC;border-style:dashed}
.tro.lock .i{filter:grayscale(1);opacity:.4}

/* Schließfach */
.locker{display:flex;flex-direction:column;gap:14px;align-items:center;background:linear-gradient(180deg,#5E6A86,#47516B);border-radius:10px;padding:24px 16px;color:#fff;box-shadow:inset 0 0 0 4px #3A4359}
.locker .lk-label{font-family:var(--display);font-size:20px}
.lk-slots{display:flex;gap:10px}
.lk-slots .slot{background:#232A3B;border:2px solid #8C96B0;color:#F7E6C2;width:56px;height:64px;font-size:34px}
.lk-letters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lk-letters .wtile{font-size:30px;min-width:56px}

/* Zertifikat */
.cert{display:flex;flex-direction:column;gap:14px}
.cert .top{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.cert .av{font-size:64px;line-height:1}
.cert h2{font-size:34px}
.cert .rank{font-family:var(--display);font-size:24px;color:#8A5A0B}
.cert .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cert .num{background:var(--cobalt-soft);border-radius:10px;padding:10px;text-align:center}
.cert .num b{display:block;font-family:var(--display);font-weight:400;font-size:28px;color:var(--cobalt);font-variant-numeric:tabular-nums}
.cert .num span{font-size:14px;color:var(--muted)}

/* Overlay */
#ov{position:fixed;inset:0;z-index:50;background:rgba(20,28,52,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
#ov.on{display:flex}
#ov .plaque{max-width:560px;width:100%;display:flex;flex-direction:column;gap:14px}
#ov .zz{font-size:56px}
.small{font-size:15px;color:var(--muted)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<header id="hud" aria-label="Spielstand">
  <div class="hud-in">
    <div class="hud-me"><span class="av" id="hud-av">🦊</span><b id="hud-nick">Viajero/a</b></div>
    <span class="hud-stat" id="hud-stars" title="Sterne">★ 0/12</span>
    <span class="hud-stat" id="hud-time" title="Spielzeit">⏱ 0:00</span>
    <button class="hud-btn" data-a="trophies" aria-label="Trophäen anzeigen">🏆</button>
    <button class="hud-btn" data-a="pause" aria-label="Pause">⏸ Pause</button>
  </div>
</header>
<main id="app"></main>
<div id="ov" role="dialog" aria-modal="true"></div>

<script>
/* ============================================================
   INHALT
   ============================================================ */
const SPK = {
  narr:{n:'', i:''},
  rule:{n:'Spielregel', i:'🎲'},
  lucia:{n:'Lucía', i:'👧'},
  sofia:{n:'Sofía', i:'🤳'},
  eva:{n:'Eva', i:'👧🏽'},
  marcos:{n:'Marcos', i:'🏊'}
};

const PROLOGUE = [
  {s:'narr', es:'Es sábado por la mañana. Llegas a Madrid en el AVE. ¡Empieza tu intercambio!', de:'Es ist Samstagmorgen. Du kommst mit dem AVE (Schnellzug) in Madrid an. Dein Austausch beginnt!'},
  {s:'lucia', es:'¡Hola! Soy Lucía, tu compañera de intercambio. ¡Bienvenido o bienvenida a Madrid!', de:'Hallo! Ich bin Lucía, deine Austauschpartnerin. Willkommen in Madrid!'},
  {s:'narr', es:'Dejas tu mochila verde en el suelo. Un chico pasa corriendo… ¡y coge tu mochila!', de:'Du stellst deinen grünen Rucksack auf den Boden. Ein Junge rennt vorbei … und schnappt sich deinen Rucksack!'},
  {s:'lucia', es:'¡Es Marcos, un chico de mi insti! Tiene una mochila verde como tu mochila. ¡Qué mala suerte!', de:'Das ist Marcos, ein Junge aus meiner Schule! Er hat einen grünen Rucksack wie deiner. So ein Pech!'},
  {s:'lucia', es:'Mira, Marcos me escribe: «Tengo una mochila que no es mía. La dejo en una taquilla del parque acuático.» ¡Pero no escribe el código!', de:'Schau, Marcos schreibt mir: „Ich habe einen Rucksack, der nicht mir gehört. Ich lege ihn in ein Schließfach im Erlebnisbad.“ Aber den Code schreibt er nicht!'},
  {s:'lucia', es:'Marcos es muy gracioso: deja las letras del código en su ruta. ¡Vamos!', de:'Marcos ist ein Witzbold: Er versteckt die Buchstaben des Codes auf seinem Weg. Los geht’s!'},
  {s:'rule', de:'Für jede geschaffte Station bekommst du einen Buchstaben des Codes. Nach jeder Station erhältst du einen Speichercode. Schreib ihn auf, dann kannst du später weiterspielen.'}
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function norm(s){ return String(s).toLowerCase().replace(/[¡!¿?.,;:«»"“”…]/g,' ').replace(/\s+/g,' ').trim(); }
function strip(s){ return norm(s).normalize('NFD').replace(/[̀-ͯ]/g,''); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function grade(t, ans){
  const a = norm(ans); if(!a) return 'empty';
  for(const x of t.answer) if(norm(x)===a) return 'exact';
  for(const x of t.answer) if(strip(x)===strip(a)) return 'accent';
  return 'wrong';
}
function lookupFb(t, ans){
  if(!t.fb) return null; const k = strip(ans);
  for(const [key,msg] of Object.entries(t.fb)) if(strip(key)===k) return msg;
  return null;
}
function fmtTime(s){ const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h? h+':'+String(m).padStart(2,'0') : m)+':'+String(x).padStart(2,'0'); }
function baseNormal(t){ return {mc:10, flex:10, listen:10, input:20, match:15, order:15}[t.type]; }
function maxNormal(i){ return STATIONS[i].tasks.reduce((s,t)=>s+baseNormal(t),0); }
function starsFor(i, score){ if(!score) return 0; const r = score/maxNormal(i); return r>=0.85?3 : r>=0.6?2 : 1; }
function totalStars(){ return S.best.reduce((s,b,i)=>s+starsFor(i,b),0); }
function totalPoints(){ return S.best.reduce((s,b)=>s+b,0); }
function hasTro(id){ const i=TROPHIES.findIndex(t=>t.id===id); return !!(S.tro & (1<<i)); }
function award(id, list){ const i=TROPHIES.findIndex(t=>t.id===id); if(!(S.tro & (1<<i))){ S.tro |= (1<<i); if(list) list.push(TROPHIES[i]); } }
function rankTitle(){ const s=totalStars(); return s>=12?'¡Leyenda de Madrid! 👑' : s>=9?'Experto/a en Madrid 🏅' : s>=5?'Explorador/a 🧭' : 'Turista 🧳'; }
function starHtml(n, big){ let h=''; for(let k=0;k<3;k++) h += k<n ? '<span>★</span>' : '<span class="off">★</span>'; return `<span class="${big?'bigstars':'stars'}" aria-label="${n} von 3 Sternen">${h}</span>`; }
function blankify(s){ return esc(s).replace(/___/g,'<span class="blank">___</span>'); }

/* Sprachausgabe */
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return false;
    const u = new SpeechSynthesisUtterance(String(text).replace(/___/g,' … ').replace(/[😃😬🏆😎🌱]/gu,''));
    u.lang = 'es-ES'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('es'));
    if(v) u.voice = v;
    speechSynthesis.cancel(); speechSynthesis.speak(u); return true;
  }catch(e){ return false; }
}

/* Speichercode: keine Daten werden gespeichert, der Code trägt den Spielstand */
const ALPH = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
const MASK = (()=>{ let x=2026, m=[]; for(let i=0;i<60;i++){ x=(Math.imul(x,1103515245)+12345)>>>0; m.push((x>>>16)&1); } return m; })();
function checksum(v,t){ return (v[0]*3+v[1]*5+v[2]*7+v[3]*11+t*13+77)%256; }
function makeCode(best=S.best, tro=S.tro){
  const v = best.map(b=>Math.min(1023,Math.max(0,b|0))); const t = tro & 1023;
  const bits = v.map(n=>n.toString(2).padStart(10,'0')).join('') + t.toString(2).padStart(10,'0') + checksum(v,t).toString(2).padStart(8,'0') + '00';
  let out='';
  for(let i=0;i<60;i+=5){ let n=0; for(let j=0;j<5;j++) n = n*2 + ((+bits[i+j]) ^ MASK[i+j]); out += ALPH[n]; }
  return out.slice(0,4)+'-'+out.slice(4,8)+'-'+out.slice(8);
}
function readCode(str){
  const c = String(str).toUpperCase().replace(/[^0-9A-Z]/g,'');
  if(c.length!==12) return null;
  let bits='';
  for(let i=0;i<12;i++){ const n = ALPH.indexOf(c[i]); if(n<0) return null; const b=n.toString(2).padStart(5,'0'); for(let j=0;j<5;j++) bits += (+b[j]) ^ MASK[i*5+j]; }
  if(bits.slice(58)!=='00') return null;
  const num = (a,b)=>parseInt(bits.slice(a,b),2);
  const v = [num(0,10),num(10,20),num(20,30),num(30,40)], t = num(40,50), chk = num(50,58);
  if(checksum(v,t)!==chk) return null;
  for(let i=1;i<4;i++) if(v[i]>0 && v[i-1]===0) return null;
  return {best:v, tro:t};
}

  </div><p class="small">Wähle dein Level für diese Station. Du kannst jede Station später wiederholen.</p>`;
  S.pending = i;
  renderStory(`${st.icon} ${st.name}`, st.intro, null, null, extra);
}

function startRun(i, level){
  const st = STATIONS[i];
  S.run = {st:i, level, queue: st.tasks.map((t,k)=>({k, rev:false})), pos:0, score:0, hints:0, mistakes:0, gerOK:true, wOK:true, rindo:false, cur:null};
  renderTask();
}

/* ---------- Aufgaben ---------- */
function modeOf(t){ const r=S.run; return t.type==='flex' ? (r.level==='experto'?'input':'mc') : t.type; }
function baseOf(t){ const m = modeOf(t); return {mc:10, listen:10, input:20, match:15, order:15}[m]; }

function renderTask(){
  const r = S.run, st = STATIONS[r.st], item = r.queue[r.pos], t = st.tasks[item.k], mode = modeOf(t);
  S.say = [];
  if(!r.cur){
    r.cur = {tries:0, hints:0, done:false, wrongPicks:[], choices: t.choices? shuffle(t.choices):null};
    if(mode==='match') r.cur.m = {L:shuffle(t.pairs.map((_,k)=>k)), R:shuffle(t.pairs.map((_,k)=>k)), sel:null, ok:[], wrong:0, flash:null};
    if(mode==='order') r.cur.o = {pool:shuffle(t.tiles.map((_,k)=>k)), picked:[]};
  }
  const n = r.queue.length, pct = Math.round(r.pos/n*100);
  const reading = t.read ? `<details class="reading" open><summary>📱 Mensaje de Marcos</summary><p>${esc(st.text)}</p><p class="gloss">${esc(st.gloss)}</p></details>` : '';
  show(`<section class="task" style="display:flex;flex-direction:column;gap:12px">
    <div class="task-top"><span class="where">${st.icon} ${esc(st.name)}</span><span>Aufgabe ${r.pos+1} / ${n}</span><span id="t-pts">🪙 ${r.score}</span></div>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="card">
      <div class="chips"><span class="chip">${esc(t.tag)}</span>${item.rev?'<span class="chip rev">💪 Revancha</span>':''}${r.level==='experto'?'<span class="chip ex">🔥 Experto</span>':''}</div>
      ${reading}
      ${t.scene?`<div class="scene" aria-hidden="true">${t.scene}</div>`:''}
      <p class="q">${esc(t.q)}</p>
      ${t.es?`<div class="es-line"><p class="es t">${blankify(t.es)}</p>${sayBtn(t.es)}</div>`:''}
      <div id="t-body"></div>
      <div id="t-fb" aria-live="polite"></div>
      <div id="t-hints" class="hints"></div>
      <div id="t-actions" class="actions"></div>
    </div></section>`, 'task');
  renderBody(); renderHints(); renderActions();
  if(r.cur.fb) setFb(r.cur.fb[0], r.cur.fb[1]);
  const inp = document.getElementById('ans'); if(inp && !r.cur.done) inp.focus({preventScroll:true});
}

function cur(){ return S.run.cur; }
function curTask(){ const r=S.run; return STATIONS[r.st].tasks[r.queue[r.pos].k]; }

function renderBody(){
  const t = curTask(), c = cur(), mode = modeOf(t), body = document.getElementById('t-body');
  if(mode==='mc' || mode==='listen'){
    const ans = t.answer[0];
    let pre = '';
    if(mode==='listen') pre = `<div class="row" style="align-items:center"><button class="btn warm listen-btn" data-a="listen">🔊 Anhören</button><span class="small">${esc(t.de)}</span></div>`;
    body.innerHTML = pre + `<div class="choices">${c.choices.map((ch,i)=>{
      let cls='', dis=c.done;
      if(c.wrongPicks.includes(ch)){ cls='bad'; dis=true; }
      if(c.done && ch===ans) cls='good';
      return `<button class="choice ${cls}" data-a="choice" data-i="${i}" ${dis?'disabled':''}>${esc(ch)}</button>`;
    }).join('')}</div>`;
  } else if(mode==='input'){
    if(!document.getElementById('ans')){
      body.innerHTML = `<input type="text" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Deine Antwort …" aria-label="Deine Antwort">
      <div class="accents" style="margin-top:8px" aria-label="Sonderzeichen">${['á','é','í','ó','ú','ñ','¿','¡'].map(ch=>`<button data-a="acc" data-c="${ch}" tabindex="-1">${ch}</button>`).join('')}</div>`;
    }
    document.getElementById('ans').disabled = c.done;
  } else if(mode==='match'){
    const m = c.m;
    const btn = (side,k)=>{
      const label = t.pairs[k][side==='L'?0:1];
      let cls=''; const ok=m.ok.includes(k);
      if(ok) cls='ok'; else if(m.sel && m.sel.side===side && m.sel.k===k) cls='sel';
      if(m.flash && m.flash[side]===k) cls='bad';
      return `<button class="mbtn ${cls}" data-a="m" data-side="${side}" data-k="${k}" ${ok||c.done?'disabled':''}>${esc(label)}</button>`;
    };
    body.innerHTML = `<div class="match"><div class="col">${m.L.map(k=>btn('L',k)).join('')}</div><div class="col">${m.R.map(k=>btn('R',k)).join('')}</div></div>`;
  } else if(mode==='order'){
    const o = c.o;
    body.innerHTML = `<div class="answer-line">${o.picked.map((k,idx)=>`<button class="wtile" data-a="atile" data-i="${idx}" ${c.done?'disabled':''}>${esc(t.tiles[k])}</button>`).join('')}</div>
      <div class="pool" style="margin-top:10px">${o.pool.filter(k=>!o.picked.includes(k)).map(k=>`<button class="wtile" data-a="tile" data-k="${k}" ${c.done?'disabled':''}>${esc(t.tiles[k])}</button>`).join('')}</div>`;
  }
}
function renderHints(){
  const t = curTask(), c = cur();
  document.getElementById('t-hints').innerHTML = t.hints.slice(0,c.hints).map((h,i)=>`<div class="hint"><b>Pista ${i+1}:</b> ${esc(h)}</div>`).join('');
}
function renderActions(){
  const t = curTask(), c = cur(), mode = modeOf(t), r = S.run;
  let h = '';
  if(c.done){
    const last = r.pos === r.queue.length-1;
    h = `<button class="btn primary" data-a="next">${last?'Station abschließen ✓':'Weiter ▸'}</button>`;
  } else {
    if(mode==='input' || mode==='order') h += `<button class="btn primary" data-a="check">Prüfen</button>`;
    if(mode==='order') h += `<button class="btn ghost" data-a="reset">↺ Zurücksetzen</button>`;
    if(c.hints < t.hints.length) h += `<button class="btn ghost" data-a="hint">💡 Pista ${c.hints+1}/${t.hints.length} (−20 %)</button>`;
  }
  const el = document.getElementById('t-actions'); el.innerHTML = h;
  if(c.done){ const b = el.querySelector('[data-a=next]'); if(b) b.focus({preventScroll:true}); }
}
function setFb(kind, html){ cur().fb=[kind,html]; document.getElementById('t-fb').innerHTML = `<div class="fb ${kind}">${html}</div>`; }
function updPts(){ const e=document.getElementById('t-pts'); if(e) e.textContent='🪙 '+S.run.score; }

function solved(quality, fixedPts){
  const r=S.run, c=cur(), t=curTask(), item=r.queue[r.pos];
  let p;
  if(fixedPts!=null) p = fixedPts;
  else { p = baseOf(t); if(c.tries>0) p*=0.5; if(quality==='accent') p*=0.75; p*=(1-0.2*c.hints); if(item.rev) p*=0.5; p=Math.max(1,Math.round(p)); }
  r.score += p; c.done = true;
  if(item.rev) r.rindo = true;
  const praise = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  let msg = `<b>${praise}</b> +${p} 🪙`;
  if(quality==='accent') msg = `<b>Fast perfekt!</b> +${p} 🪙<br>Achte auf den Akzent: <b>${esc(t.answer[0])}</b>`;
  else if(modeOf(t)==='input' || modeOf(t)==='order') msg += `<br>${esc(t.answer[0])}`;
  if(item.rev) msg += '<br>💪 Revancha geschafft, aus Fehlern gelernt!';
  setFb('ok', msg); renderBody(); renderActions(); updPts();
}
function failed(ans){
  const r=S.run, c=cur(), t=curTask(), item=r.queue[r.pos], mode=modeOf(t);
  c.tries++; r.mistakes++;
  if(t.tag==='Gerundio') r.gerOK=false;
  if(t.tag==='Leseverstehen') r.wOK=false;
  const m = lookupFb(t, ans);
  if(c.tries<2){
    setFb('bad', `<b>Leider nicht.</b> ${m?esc(m):'Lies den Satz noch einmal genau.'}<br>Noch ein Versuch (halbe Punkte), oder hol dir eine Pista.`);
    const inp=document.getElementById('ans'); if(inp){ inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.select(); }
    renderBody(); renderActions();
  } else {
    c.done = true;
    let rq='';
    if(!item.rev){ r.queue.push({k:item.k, rev:true}); rq='<br>💪 Diese Aufgabe kommt als <b>Revancha</b> am Ende der Station noch einmal.'; }
    setFb('bad', `<b>Leider falsch.</b> ${m?esc(m)+'<br>':''}Richtig ist: <b>${esc(t.answer[0])}</b><span class="rule">Merke: ${esc(t.hints[0])}</span>${rq}`);
    renderBody(); renderActions();
  }
}

function onChoice(i){
  const c=cur(), t=curTask(); if(c.done) return;
  const ch = c.choices[i];
  if(ch===t.answer[0]) solved('exact');
  else { c.wrongPicks.push(ch); failed(ch); }
}
function onCheck(){
  const c=cur(), t=curTask(), mode=modeOf(t); if(c.done) return;
  let ans;
  if(mode==='input'){ ans = document.getElementById('ans').value; }
  else if(mode==='order'){
    if(c.o.picked.length < t.tiles.length){ setFb('info','Benutze alle Wörter, dann prüfen.'); return; }
    ans = c.o.picked.map(k=>t.tiles[k]).join(' ');
  }
  const g = grade(t, ans);
  if(g==='empty'){ setFb('info','Schreib zuerst eine Antwort.'); return; }
  if(g==='exact' || g==='accent') solved(g); else failed(ans);
}
function onMatch(side, k){
  const c=cur(), t=curTask(), m=c.m; if(c.done || m.ok.includes(k)) return;
  m.flash = null;
  if(!m.sel || m.sel.side===side){ m.sel = {side,k}; renderBody(); return; }
  const other = m.sel; m.sel = null;
  if(other.k===k){ m.ok.push(k); }
  else { m.wrong++; S.run.mistakes++; m.flash = side==='L'? {L:k, R:other.k} : {R:k, L:other.k}; setTimeout(()=>{ if(S.run && S.run.cur===c){ m.flash=null; renderBody(); } }, 600); }
  renderBody();
  if(m.ok.length===t.pairs.length){
    let p = Math.max(3, 15 - 3*m.wrong); p = Math.max(1, Math.round(p*(1-0.2*c.hints)));
    if(S.run.queue[S.run.pos].rev) p = Math.max(1, Math.round(p*0.5));
    solved('exact', p);
    if(m.wrong) setFb('ok', `<b>¡Todo correcto!</b> +${p} 🪙 <span class="small">(${m.wrong} Fehlversuch${m.wrong>1?'e':''})</span>`);
  }
}
function onHint(){ const c=cur(), t=curTask(); if(c.done || c.hints>=t.hints.length) return; c.hints++; S.run.hints++; renderHints(); renderActions(); }
function nextTask(){
  const r=S.run; r.pos++; r.cur=null;
  if(r.pos>=r.queue.length) finishStation(); else renderTask();
}

function finishStation(){
  const r = S.run, i = r.st, st = STATIONS[i];
  const score = Math.max(1, r.score), prev = S.best[i], first = prev===0;
  S.best[i] = Math.max(prev, score);
  const stars = starsFor(i, score), news = [];
  if(r.hints===0) award('sinpistas', news);
  if(r.level==='experto') award('valiente', news);
  if(i===1 && r.gerOK) award('gerundio', news);
  if(i===1) award('eco', news);
  if(i===2 && stars===3) award('agua', news);
  if(i===3 && r.wOK) award('detective', news);
  if(r.rindo) award('rindo', news);
  if(r.hints===0 && r.mistakes===0) award('perfecto', news);
  if(totalStars()===12) award('leyenda', news);
  S.run = null;
  const code = makeCode();
  const extra = `<div class="plaque result">
    ${starHtml(stars, true)}
    <p><b>${score} Punkte</b> in dieser Runde. ${!first && score>prev?'🎉 Neuer Rekord für diese Station!':''}${!first && score<=prev?`Dein Rekord bleibt ${prev} Punkte.`:''}</p>
    <div class="letter-row"><div class="letter-tile" aria-label="Buchstabe ${st.letter}">${st.letter}</div><p>${first?'Neuer Buchstabe für den Code!':'Diesen Buchstaben hast du schon.'}</p></div>
    ${news.length?`<div class="newtro"><b>Neue Trophäe${news.length>1?'n':''}!</b>${news.map(t=>`<div class="tro-line"><span class="i">${t.i}</span><span><b>${esc(t.n)}</b><br><span class="small">${esc(t.d)}</span></span></div>`).join('')}</div>`:''}
    <div class="codebox"><div><span class="lbl">Speichercode: abschreiben!</span><span class="c">${code}</span></div><button data-a="copy" data-c="${code}">Kopieren</button></div>
    ${stars<3?'<p class="small">Tipp: Wiederhole die Station später, um mehr Sterne zu holen. Gezählt wird immer dein bestes Ergebnis.</p>':''}
  </div>
  <div class="row"><button class="btn primary" data-a="map">Zur Karte ▸</button><button class="btn ghost" data-a="open-st" data-i="${i}">Station wiederholen</button></div>`;
  renderStory('¡Estación completada!', st.outro, null, null, extra);
}

/* ---------- Schließfach & Ende ---------- */
function renderLocker(){
  if(!S.lk) S.lk = {letters:['S','A','L','O'], picked:[], wrong:0, msg:''};
  const L = S.lk;
  const extra = `<div class="locker">
    <span class="lk-label">Taquilla nº 7</span>
    <div class="lk-slots">${[0,1,2,3].map(k=>`<span class="slot">${L.picked[k]!=null?L.letters[L.picked[k]]:''}</span>`).join('')}</div>
    <div class="lk-letters">${L.letters.map((ch,k)=>`<button class="wtile" data-a="lk" data-k="${k}" ${L.picked.includes(k)?'disabled style="opacity:.3"':''}>${ch}</button>`).join('')}</div>
  </div>
  ${L.msg?`<div class="fb bad">${L.msg}</div>`:''}
  <div class="row"><button class="btn ghost" data-a="lk-clear">↺ Zurücksetzen</button><button class="btn ghost" data-a="map">Zur Karte</button></div>`;
  renderStory('🗝️ La taquilla', LOCKER_INTRO, null, null, extra);
}
function onLocker(k){
  const L=S.lk; if(L.picked.includes(k) || L.picked.length>=4) return;
  L.picked.push(k); L.msg='';
  if(L.picked.length===4){
    const w = L.picked.map(x=>L.letters[x]).join('');
    if(w==='OLAS'){ S.lk=null; const news=[]; award('mision', news); if(totalStars()===12) award('leyenda', news); renderStory('¡Misión cumplida!', FINALE, '📜 Zum Zertifikat', renderCert); return; }
    L.wrong++; L.picked=[];
    L.msg = L.wrong===1 ? `„${w}“ öffnet das Schließfach nicht. Tipp: Im Wellenbad gibt es viele davon (Plural!).`
      : `„${w}“ ist es nicht. Tipp: la ola, im Plural … Das Wort beginnt mit O.`;
  }
  renderLocker();
}
function renderCert(){
  const today = new Date().toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'});
  const got = TROPHIES.filter(t=>hasTro(t.id)).length;
  show(`<section class="plaque cert">
    <div class="top"><span class="calle small" style="letter-spacing:.18em;text-transform:uppercase">Certificado · ${today}</span>
      <span class="av">${S.avatar}</span><h2>${esc(S.nick)}</h2><span class="rank">${rankTitle()}</span></div>
    <div class="nums">
      <div class="num"><b>${totalStars()}/12</b><span>Sterne</span></div>
      <div class="num"><b>${totalPoints()}</b><span>Punkte</span></div>
      <div class="num"><b>${got}/${TROPHIES.length}</b><span>Trophäen</span></div>
    </div>
    <div class="tgrid">${TROPHIES.map(t=>`<div class="tro ${hasTro(t.id)?'':'lock'}"><span class="i">${t.i}</span><b>${esc(t.n)}</b><span>${esc(t.d)}</span></div>`).join('')}</div>
    <div class="codebox"><div><span class="lbl">Dein Endcode (für deine Lehrkraft)</span><span class="c">${makeCode()}</span></div><button data-a="copy" data-c="${makeCode()}">Kopieren</button></div>
    <p class="small">Mach einen Screenshot oder notiere den Code. Willst du mehr Sterne? Spiel einzelne Stationen noch einmal.</p>
    <div class="row"><button class="btn primary" data-a="map">Stationen verbessern</button></div>
  </section>`, 'cert');
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('pointerdown', e=>{ if(e.target.closest('[data-a=acc]')) e.preventDefault(); });
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]'); if(!b || b.disabled) return;
  const a = b.dataset.a;
  switch(a){
    case 'avatar': S.avatar=b.dataset.v; document.querySelectorAll('[data-a=avatar]').forEach(x=>x.setAttribute('aria-pressed', x.dataset.v===S.avatar)); break;
    case 'new': {
      S.nick = (document.getElementById('nick').value.trim() || 'Viajero/a').slice(0,16);
      S.best=[0,0,0,0]; S.tro=0; S.elapsed=0;
      renderStory('¡Bienvenido/a a Madrid!', PROLOGUE, 'Zur Karte ▸', ()=>renderMap());
      break; }
    case 'load': {
      const d = readCode(document.getElementById('codein').value);
      S.nick = (document.getElementById('nick').value.trim() || 'Viajero/a').slice(0,16);
      if(!d){ renderStart('Dieser Code stimmt nicht. Prüfe jeden Buchstaben (es gibt keine 0, 1, I oder O).'); break; }
      S.best=d.best; S.tro=d.tro; S.elapsed=0;
      renderMap(`¡Hola de nuevo! Dein Spielstand ist geladen: ${totalStars()} Sterne, ${totalPoints()} Punkte.`);
      break; }
    case 'story-next': if(S.next) S.next(); break;
    case 'de': { const on = !document.body.classList.contains('show-de'); document.body.classList.toggle('show-de', on); b.setAttribute('aria-pressed', on); break; }
    case 'say': speak(S.say[+b.dataset.t]); break;
    case 'listen': if(!speak(curTask().say)) setFb('info','Auf diesem Gerät gibt es keine Vorlesestimme. Nutze die Bedeutung als Hilfe.'); break;
    case 'open-st': openStation(+b.dataset.i); break;
    case 'level': startRun(S.pending, b.dataset.v); break;
    case 'choice': onChoice(+b.dataset.i); break;
    case 'check': onCheck(); break;
    case 'hint': onHint(); break;
    case 'next': nextTask(); break;
    case 'm': onMatch(b.dataset.side, +b.dataset.k); break;
    case 'tile': { const c=cur(); if(c.done) break; c.o.picked.push(+b.dataset.k); renderBody(); break; }
    case 'atile': { const c=cur(); if(c.done) break; c.o.picked.splice(+b.dataset.i,1); renderBody(); break; }
    case 'reset': { const c=cur(); if(c.done) break; c.o.picked=[]; renderBody(); break; }
    case 'acc': { const inp=document.getElementById('ans'); if(!inp||inp.disabled) break; const s=inp.selectionStart??inp.value.length, en=inp.selectionEnd??s; inp.setRangeText(b.dataset.c, s, en, 'end'); inp.focus(); break; }
    case 'map': S.run=null; renderMap(); break;
    case 'locker': renderLocker(); break;
    case 'lk': onLocker(+b.dataset.k); break;
    case 'lk-clear': if(S.lk){ S.lk.picked=[]; S.lk.msg=''; } renderLocker(); break;
    case 'cert': renderCert(); break;
    case 'pause': openPause(); break;
    case 'trophies': openTrophies(); break;
    case 'resume': closeOv(); break;
    case 'abort': closeOv(); S.run=null; renderMap('Station abgebrochen. Du kannst sie jederzeit neu starten.'); break;
    case 'copy': {
      const code=b.dataset.c;
      try{ navigator.clipboard.writeText(code).then(()=>{ b.textContent='Kopiert ✓'; }).catch(()=>{ b.textContent='Bitte abschreiben'; }); }
      catch(err){ b.textContent='Bitte abschreiben'; }
      break; }
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.id==='ans'){ e.preventDefault(); const c=S.run&&S.run.cur; if(c && c.done) nextTask(); else onCheck(); }
  if(e.key==='Enter' && e.target.id==='codein'){ e.preventDefault(); document.querySelector('[data-a=load]').click(); }
  if(e.key==='Escape' && ov.classList.contains('on')) closeOv();
});

/* Start (mit Wiederaufnahme nach Aktualisierung im Viewer) */
function boot(data){
  if(data && Array.isArray(data.best)){
    S.nick=data.nick||'Viajero/a'; S.avatar=data.avatar||'🦊'; S.best=data.best; S.tro=data.tro||0; S.elapsed=data.elapsed||0;
    renderMap(); return;
  }
  renderStart();
}
window.claude?.hot?.snapshot?.(()=> S.screen==='start' ? {} : {nick:S.nick, avatar:S.avatar, best:S.best, tro:S.tro, elapsed:S.elapsed});
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body>
